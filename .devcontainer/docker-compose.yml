version: "3.8"

volumes:
  iris_data:
  postgres_data:

networks:
  devcontainer:

services:
  # Our dev env & workspace lives in this container
  frontend:
    image: node:23-alpine
    profiles: [ "new-ui" ]
    container_name: iris_sveltekit_frontend
    working_dir: /app
    env_file:
      - ../.env
    environment:
      - IRIS_SVELTEKIT_FRONTEND_DIR=${IRIS_SVELTEKIT_FRONTEND_DIR:-../iris-frontend}
      - PUBLIC_EXTERNAL_API_URL=${PUBLIC_EXTERNAL_API_URL:-https://127.0.0.1}
      - PUBLIC_INTERNAL_API_URL=http://${IRIS_UPSTREAM_SERVER}:${IRIS_UPSTREAM_PORT}
      - PUBLIC_USE_MOCK_API_DATA=false
      - ORIGIN=https://127.0.0.1
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - NODE_ENV=development
    volumes:
      - ${IRIS_SVELTEKIT_FRONTEND_DIR:-../iris-frontend}:/app # Map the frontend directory dynamically
      - /app/node_modules # Ensure `node_modules` is preserved inside the container
    ports:
      - "5173:5173"
    command: sh -c "npm install && NODE_OPTIONS="--inspect" npm run dev -- --host"
    networks:
      - devcontainer

  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/iris-web
      - iris_data:/home/vscode/iris_data
      - ./ui/dist:/iris-web/static
    command: sleep infinity
    networks:
      - devcontainer
    env_file:
      - ../.env
    environment:
      - DOCKERIZED=1
      - IRIS_ORGANISATION_NAME=DFIR IRIS Web DevContainer
      - IRIS_LOGIN_BANNER_TEXT=You've successfully setup DFIR IRIS in a DevContainer! Default credentials are username "devcontainer" / password "DevContainersR0ck!".
      - IRIS_ADM_PASSWORD=DevContainersR0ck!
      - IRIS_ADM_API_KEY=B8BA5D730210B50F41C06941582D7965D57319D5685440587F98DFDC45A01594
      - IRIS_ADM_EMAIL=admin@localhost
      - IRIS_ADM_USERNAME=devcontainer
      - IRIS_ASSET_STORE_PATH=/home/vscode/iris_data/custom_assets
      - IRIS_BACKUP_PATH=/home/vscode/iris_data/backup
      - IRIS_DATASTORE_PATH=/home/vscode/iris_data/datastore
      - IRIS_TEMPLATES_PATH=/home/vscode/iris_data/user_templates
      - IRIS_UPDATES_PATH=/home/vscode/iris_data/updates
      - IRIS_UPLOADED_PATH=/home/vscode/iris_data/downloads

  # ---- iris dependencies --------------------------------

  # Postgres
  db:
    build:
      context: ../docker/db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devcontainer
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_ADMIN_USER=raptor
      - POSTGRES_ADMIN_PASSWORD=admin
      - POSTGRES_DB=iris_db

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    networks:
      - devcontainer
